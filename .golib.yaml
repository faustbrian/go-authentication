schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
  - module: "authotel"
    archive: ".verification/mutation/bootstrap/authotel.zip"
    ledger: ".verification/mutation/migration-ledger.json"
  - module: "jwt"
    archive: ".verification/mutation/bootstrap/jwt.zip"
    ledger: ".verification/mutation/migration-ledger.json"
  - module: "oidc"
    archive: ".verification/mutation/bootstrap/oidc.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/root.txt
  - module: "authotel"
    mode: apidiff
    path: api/authotel.txt
  - module: "jwt"
    mode: apidiff
    path: api/jwt.txt
  - module: "oidc"
    mode: apidiff
    path: api/oidc.txt
operations:
- module: "."
  gate: conformance
  steps:
  - type: make
    makefile: verification/package.mk
    target: conformance
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPrincipalClaims$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./authhttp"]
    fuzz: '^FuzzAuthorizationExtraction$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./authhttp"]
    fuzz: '^FuzzCredentialHeaderSet$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./authhttp"]
    fuzz: '^FuzzChallengeFormatting$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["./authhttp"]
    fuzz: '^FuzzBearerQueryExtraction$'
    budget: 10000x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: "authotel"
  gate: fuzz
