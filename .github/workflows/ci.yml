name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        type: boolean
        default: false
      release_module:
        description: Rehearse exactly one module directory; blank rehearses every module
        required: false
        type: string
        default: ''
      root_qualification:
        description: Run the complete root contract with the pinned source-built verifier
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  qualification-inputs:
    name: Validate qualification selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject combined qualification selectors
        env:
          ROOT_QUALIFICATION: ${{ inputs.root_qualification || false }}
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run || false }}
          RELEASE_MODULE: ${{ inputs.release_module || '' }}
        run: |
          set -euo pipefail
          if [[ "${ROOT_QUALIFICATION}" == true && ( "${RELEASE_DRY_RUN}" == true || -n "${RELEASE_MODULE}" ) ]]; then
            echo 'root_qualification cannot be combined with release selectors' >&2
            exit 1
          fi

  ci:
    needs: qualification-inputs
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@ef9ae418c61b6b92d8d93c03d71694031ec47ed8 # v2.5.2
    with:
      tooling_sha: ef9ae418c61b6b92d8d93c03d71694031ec47ed8
      source_bootstrap: false
      source_documentation: check
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_module || '' }}

  protocol-boundary:
    name: Protocol boundary
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Prepare private protocol workspace
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/authentication-protocol-boundary.XXXXXX")"
          {
            echo "PROTOCOL_TASK=${task}"
            echo "GOCACHE=${task}/cache"
            echo "GOMODCACHE=${task}/mod"
            echo "GOTMPDIR=${task}/tmp"
            echo "TMPDIR=${task}/tmp"
          } >>"${GITHUB_ENV}"
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
      - name: Verify pinned protocol vectors
        run: |
          set -euo pipefail
          case "${PROTOCOL_TASK}" in
            "${RUNNER_TEMP}"/authentication-protocol-boundary.*) ;;
            *) echo 'unexpected protocol workspace' >&2; exit 1 ;;
          esac
          cleanup() {
            status=$?
            if [[ -d "${PROTOCOL_TASK}" ]]; then
              chmod -R u+w "${PROTOCOL_TASK}" || status=1
              find "${PROTOCOL_TASK}" -depth -delete || status=1
            fi
            test ! -e "${PROTOCOL_TASK}" || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          make -f verification/package.mk conformance
      - name: Remove private protocol workspace
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${PROTOCOL_TASK:-}" ]]; then
            exit 0
          fi
          case "${PROTOCOL_TASK}" in
            "${RUNNER_TEMP}"/authentication-protocol-boundary.*) ;;
            *) echo 'unexpected protocol workspace' >&2; exit 1 ;;
          esac
          if [[ -d "${PROTOCOL_TASK}" ]]; then
            chmod -R u+w "${PROTOCOL_TASK}"
            find "${PROTOCOL_TASK}" -depth -delete
          fi
          test ! -e "${PROTOCOL_TASK}"

  root-qualification:
    name: Root qualification
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.root_qualification
    needs: qualification-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: d38bf31e7403501075442de9fde78f9479052996
          persist-credentials: false
          path: tooling
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/.go-version
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Prepare private qualification workspace
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/authentication-root-qualification.XXXXXX")"
          {
            echo "QUALIFICATION_TASK=${task}"
            echo "GOCACHE=${task}/cache"
            echo "GOMODCACHE=${task}/mod"
            echo "GOTMPDIR=${task}/tmp"
            echo "TMPDIR=${task}/tmp"
            echo "GOLANGCI_LINT_CACHE=${task}/lint"
            echo "XDG_CACHE_HOME=${task}/xdg"
            echo "NPM_CONFIG_CACHE=${task}/npm"
          } >>"${GITHUB_ENV}"
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp" "${task}/lint" "${task}/xdg" "${task}/npm"
      - name: Build exact source tooling without a release identity
        working-directory: tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d38bf31e7403501075442de9fde78f9479052996
          go build -trimpath -buildvcs=false -o "${QUALIFICATION_TASK}/golib" ./cmd/golib
          test "$("${QUALIFICATION_TASK}/golib" --version)" = dev
      - name: Qualify the complete root contract
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD 'HEAD^{tree}'
          git -C ../tooling rev-parse HEAD 'HEAD^{tree}'
          "${QUALIFICATION_TASK}/golib" repository check
          "${QUALIFICATION_TASK}/golib" specification check
          "${QUALIFICATION_TASK}/golib" check --module .
      - name: Retain native root qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-qualification
          path: source/.verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Remove private qualification workspace
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${QUALIFICATION_TASK:-}" ]]; then
            exit 0
          fi
          case "${QUALIFICATION_TASK}" in
            "${RUNNER_TEMP}"/authentication-root-qualification.*) ;;
            *) echo 'unexpected qualification workspace' >&2; exit 1 ;;
          esac
          if [[ -d "${QUALIFICATION_TASK}" ]]; then
            chmod -R u+w "${QUALIFICATION_TASK}"
            find "${QUALIFICATION_TASK}" -depth -delete
          fi
          test ! -e "${QUALIFICATION_TASK}"

  required:
    name: Required
    if: always()
    needs: [ci, protocol-boundary, qualification-inputs, root-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          CI_RESULT: ${{ needs.ci.result }}
          PROTOCOL_RESULT: ${{ needs.protocol-boundary.result }}
          INPUT_RESULT: ${{ needs.qualification-inputs.result }}
          ROOT_QUALIFICATION: ${{ inputs.root_qualification || false }}
          QUALIFICATION_RESULT: ${{ needs.root-qualification.result }}
        run: |
          set -euo pipefail
          test "${CI_RESULT}" = success
          test "${PROTOCOL_RESULT}" = success
          test "${INPUT_RESULT}" = success
          if [[ "${ROOT_QUALIFICATION}" == true ]]; then
            test "${QUALIFICATION_RESULT}" = success
          else
            test "${QUALIFICATION_RESULT}" = skipped
          fi
