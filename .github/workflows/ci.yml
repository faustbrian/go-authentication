name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@1f9629e5f27418600460b55a50a5b2fc81697fab # v1.2.0
    with:
      tooling_sha: 1f9629e5f27418600460b55a50a5b2fc81697fab
      release_dry_run: ${{ inputs.release_dry_run || false }}

  specification:
    name: Specification governance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 1f9629e5f27418600460b55a50a5b2fc81697fab
          path: .golib-tooling
          persist-credentials: false
      - uses: ./.golib-tooling/.github/actions/setup-golib
      - run: golib specification check --online

  required:
    name: Required
    if: always()
    needs: [ci, specification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow and specification governance
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SPECIFICATION_RESULT: ${{ needs.specification.result }}
        run: test "${CI_RESULT}" = success && test "${SPECIFICATION_RESULT}" = success
